name: CI / Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Release, Debug]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure CMake
      run: >
        cmake -B build
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DBUILD_TESTING=ON

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Run Tests
      working-directory: build
      run: ctest -C ${{ matrix.build_type }} --output-on-failure -VV

  coverage:
    name: Code Coverage (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install lcov
      run: sudo apt-get update && sudo apt-get install -y lcov

    - name: Configure CMake with coverage flags
      run: >
        cmake -B build
        -DCMAKE_BUILD_TYPE=Debug
        -DBUILD_TESTING=ON
        -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage"
        -DCMAKE_EXE_LINKER_FLAGS="--coverage"

    - name: Build
      run: cmake --build build

    - name: Run Tests
      working-directory: build
      run: ctest --output-on-failure -VV

    - name: Collect coverage
      continue-on-error: true
      run: |
        lcov --capture --directory build --output-file coverage.info --ignore-errors mismatch,unused,empty || lcov --capture --directory build --output-file coverage.info || true
        lcov --remove coverage.info '/usr/*' '*/build/_deps/*' '*/tests/*' --output-file coverage.info --ignore-errors mismatch,unused,empty || true
        lcov --list coverage.info || true

    - name: Upload coverage artifact
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: coverage-report
        path: coverage.info
